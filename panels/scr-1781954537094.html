window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#result-tbody\");\n  const historyPanel = container.querySelector(\"#history-panel\");\n  const historyTimeline = container.querySelector(\"#history-timeline\");\n  const assigneeSelect = container.querySelector(\"#select-assignee\");\n  \n  let allRecords = [];\n  let selectedRecordId = null;\n\n  // ===== 1. 再描画関数 =====\n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '<tr style=\"height: 2rem; text-align: center; color: var(--text-muted);\"><td colspan=\"6\">検索結果がありません</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML = rows.map(r => {\n      const type = r.契約種別 || r.提案資料名 ? (r.契約書名 ? '契約書' : '提案資料') : '不明';\n      const name = r.契約書名 || r.提案資料名 || '(無名)';\n      const status = r.ステータス || '不明';\n      const createdDate = r.作成日時 ? new Date(r.作成日時).toLocaleDateString('ja-JP') : '-';\n      const updatedDate = r.更新日時 ? new Date(r.更新日時).toLocaleDateString('ja-JP') : '-';\n      \n      return `<tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: background 0.2s;\">\n        <td style=\"padding: 0.75rem; color: var(--text);\">${name}</td>\n        <td style=\"padding: 0.75rem; color: var(--text-muted);\">${type}</td>\n        <td style=\"padding: 0.75rem;\">\n          <span style=\"display: inline-block; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; background: ${getStatusColor(status)}; color: #fff;\">\n            ${status}\n          </span>\n        </td>\n        <td style=\"padding: 0.75rem; color: var(--text-muted);\">${createdDate}</td>\n        <td style=\"padding: 0.75rem; color: var(--text-muted);\">${updatedDate}</td>\n        <td style=\"padding: 0.75rem; text-align: center;\">\n          <button class=\"action-btn secondary view-detail-btn\" data-id=\"${r.id}\" style=\"padding: 0.375rem 0.75rem; font-size: 0.75rem; margin-right: 0.25rem;\">詳細</button>\n          <button class=\"action-btn secondary delete-btn\" data-id=\"${r.id}\" style=\"padding: 0.375rem 0.75rem; font-size: 0.75rem;\">削除</button>\n        </td>\n      </tr>`;\n    }).join(\"\");\n  }\n\n  function getStatusColor(status) {\n    const colors = {\n      '草案': '#6b7280',\n      '承認待ち': '#f59e0b',\n      '有効': '#10b981',\n      '終了': '#6b7280',\n      'キャンセル': '#ef4444',\n      '下書き': '#6b7280',\n      '提案中': '#3b82f6',\n      '契約済み': '#10b981',\n      '却下': '#ef4444'\n    };\n    return colors[status] || '#9ca3af';\n  }\n\n  // ===== 2. 初期データ読み込み =====\n  async function loadInitialData() {\n    const contracts = await window.aivicApi.list(0) || [];\n    const proposals = await window.aivicApi.list(1) || [];\n    \n    allRecords = [...contracts, ...proposals];\n    renderRows(allRecords);\n    \n    // 担当者リストを populate\n    const users = await window.aivicApi.list(2) || [];\n    const uniqueUsers = [...new Set(users.map(u => u.氏名))];\n    uniqueUsers.forEach(name => {\n      const opt = document.createElement('option');\n      opt.value = name;\n      opt.textContent = name;\n      assigneeSelect.appendChild(opt);\n    });\n  }\n\n  loadInitialData();\n\n  // ===== 3. 検索ボタン =====\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const keyword = container.querySelector(\"#input-keyword\").value.toLowerCase();\n    const typeFilter = container.querySelector(\"#select-type\").value;\n    const statusFilter = container.querySelector(\"#select-status\").value;\n    const dateFrom = container.querySelector(\"#input-date-from\").value;\n    const dateTo = container.querySelector(\"#input-date-to\").value;\n    const assigneeFilter = container.querySelector(\"#select-assignee\").value;\n\n    let filtered = allRecords.filter(r => {\n      const name = (r.契約書名 || r.提案資料名 || '').toLowerCase();\n      const type = r.契約種別 ? '契約書' : '提案資料';\n      const status = r.ステータス || '';\n      const createdDate = r.作成日時 ? new Date(r.作成日時).toISOString().split('T')[0] : '';\n      \n      const matchKeyword = !keyword || name.includes(keyword);\n      const matchType = !typeFilter || type === typeFilter;\n      const matchStatus = !statusFilter || status === statusFilter;\n      const matchDateFrom = !dateFrom || createdDate >= dateFrom;\n      const matchDateTo = !dateTo || createdDate <= dateTo;\n      const matchAssignee = !assigneeFilter || (r.担当者 === assigneeFilter || r.ユーザーID === assigneeFilter);\n\n      return matchKeyword && matchType && matchStatus && matchDateFrom && matchDateTo && matchAssignee;\n    });\n\n    renderRows(filtered);\n  });\n\n  // ===== 4. 行クリック（詳細・変更履歴表示） =====\n  container.addEventListener(\"click\", async e => {\n    const detailBtn = e.target.closest(\".view-detail-btn\");\n    if (detailBtn) {\n      selectedRecordId = detailBtn.dataset.id;\n      const record = allRecords.find(r => r.id === selectedRecordId);\n      \n      if (record) {\n        // 変更履歴を取得\n        const histories = await window.aivicApi.list(3) || [];\n        const recordHistories = histories.filter(h => h.対象ID === selectedRecordId);\n        \n        // タイムライン表示\n        historyTimeline.innerHTML = recordHistories.map(h => `\n          <div style=\"margin-bottom: 1rem; position: relative;\">\n            <div style=\"position: absolute; left: -1.5rem; top: 0.25rem; width: 0.75rem; height: 0.75rem; background: var(--primary); border-radius: 50%; border: 2px solid var(--bg-card);\"></div>\n            <div style=\"background: rgba(0,0,0,0.2); padding: 0.75rem; border-radius: 0.375rem;\">\n              <div style=\"font-weight: 600; color: var(--primary); font-size: 0.875rem;\">${h.変更種別}</div>\n              <div style=\"color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem;\">\n                ${h.変更フィールド ? `フィールド: ${h.変更フィールド}` : ''}\n              </div>\n              ${h.変更前値 ? `<div style=\"color: var(--text-muted); font-size: 0.75rem;\">変更前: ${h.変更前値}</div>` : ''}\n              ${h.変更後値 ? `<div style=\"color: var(--text); font-size: 0.75rem;\">変更後: ${h.変更後値}</div>` : ''}\n              <div style=\"color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem;\">\n                ${new Date(h.作成日時).toLocaleString('ja-JP')}\n              </div>\n            </div>\n          </div>\n        `).join(\"\");\n        \n        historyPanel.style.display = 'block';\n      }\n    }\n\n    // 削除ボタン\n    const delBtn = e.target.closest(\".delete-btn\");\n    if (delBtn) {\n      if (!confirm(\"この資料を削除しますか？\")) return;\n      const recordId = delBtn.dataset.id;\n      const record = allRecords.find(r => r.id === recordId);\n      const tableIndex = record.契約書名 ? 0 : 1;\n      \n      await window.aivicApi.delete(tableIndex, recordId);\n      allRecords = allRecords.filter(r => r.id !== recordId);\n      renderRows(allRecords);\n      historyPanel.style.display = 'none';\n    }\n  });\n\n  // 履歴パネルを閉じる\n  container.querySelector(\"#btn-close-history\").addEventListener(\"click\", () => {\n    historyPanel.style.display = 'none';\n  });\n\n  // ===== CSVエクスポート =====\n  container.querySelector(\"[data-testid='export-csv-button']\").addEventListener(\"click\", () => {\n    if (allRecords.length === 0) {\n      alert(\"エクスポートするデータがありません\");\n      return;\n    }\n\n    const headers = ['資料名', '種別', 'ステータス', '作成日', '最終更新日'];\n    const rows = allRecords.map(r => [\n      r.契約書名 || r.提案資料名 || '',\n      r.契約種別 ? '契約書' : '提案資料',\n      r.ステータス || '',\n      r.作成日時 ? new Date(r.作成日時).toLocaleDateString('ja-JP') : '',\n      r.更新日時 ? new Date(r.更新日時).toLocaleDateString('ja-JP') : ''\n    ]);\n\n    const csv = '\\uFEFF' + [headers, ...rows].map(row => \n      row.map(cell => `\"${String(cell).replace(/\"/g, '\"\"')}\"`).join(',')\n    ).join('\\n');\n\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `資料検索結果_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  });\n}";
</script>

*, *::before, *::after { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg-main); color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.top-bar { display:flex; align-items:center; gap:0; background:var(--top-bar-bg, var(--bg-sidebar)); border-bottom:1px solid var(--top-bar-border, var(--border)); padding:0 16px; height:48px; flex-shrink:0; }
.top-bar .app-name { font-size:14px; font-weight:700; color:var(--text); margin-right:20px; white-space:nowrap; }
.sys-tab { background:transparent; color:var(--text); opacity:0.6; border:none; border-bottom:2px solid transparent; padding:0 16px; height:48px; cursor:pointer; font-size:13px; white-space:nowrap; transition:color .15s, border-color .15s, opacity .15s; text-decoration:none; display:flex; align-items:center; }
.sys-tab:hover { opacity:0.85; }
.sys-tab.active, .sys-tab.aivic-active { color:var(--text); opacity:1; border-bottom-color:var(--primary); font-weight:600; }
.app-body { display:flex; flex:1; overflow:hidden; }
.sidebar { width:220px; background:var(--bg-sidebar); border-right:1px solid var(--border); padding:12px 8px; overflow-y:auto; flex-shrink:0; }
.sidebar-sys-name { margin:0 0 8px; padding:4px 8px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }
.nav-btn { display:block; width:100%; text-align:left; background:transparent; color:var(--text); opacity:0.65; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px; margin-bottom:2px; transition:opacity .15s,background .15s; text-decoration:none; }
.nav-btn:hover { background:var(--border); opacity:0.9; }
.nav-btn.active, .nav-btn.aivic-active { background:var(--primary); color:#fff; opacity:1; }
.main { flex:1; padding:16px; overflow-y:auto; }
.card { border:1px solid var(--border); border-radius:12px; padding:16px; background:var(--bg-card); margin-bottom:12px; }
.hidden { display:none !important; }
.action-btn { background:var(--primary); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
.action-btn:hover { background:var(--primary-hover, #1a55ef); }
.action-btn.secondary { background:var(--border); color:var(--text); }
.input { background:var(--bg-main); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 10px; font-size:13px; }
.muted { color:var(--text-muted); font-size:13px; }
.table-wrap { overflow:auto; border:1px solid var(--border); border-radius:8px; }
table { width:100%; border-collapse:collapse; }
th, td { border-bottom:1px solid var(--border); padding:8px 10px; text-align:left; font-size:13px; }
th { color:var(--text); background:var(--bg-sidebar); position:sticky; top:0; font-weight:600; }
tr:hover { background:var(--bg-sidebar); cursor:pointer; }
canvas { display:block; max-height:280px !important; }
.chart-wrap, .chart-container, [class*="chart"] { position:relative; height:260px; max-height:280px; }
@media (max-width:768px) {

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });
})();

</script>
