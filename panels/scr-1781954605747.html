              <button class="action-btn" id="btn-save-template" data-testid="save-template-button" style="flex: 1; font-size: 13px; padding: 10px;">保存</button>
              <button class="action-btn secondary" id="btn-duplicate-template" data-testid="duplicate-template-button" style="flex: 1; font-size: 13px; padding: 10px;">複製</button>

            </div>

          </div>

          <!-- プレビューセクション -->
          <div style="border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; background: rgba(0,0,0,0.15); max-height: 200px; overflow-y: auto;">
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500;">プレビュー</div>
            <div id="template-preview" data-testid="template-preview" style="background: var(--bg-main); padding: 10px; border-radius: 4px; font-size: 12px; color: var(--text); line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow-y: auto;">
              <!-- プレビューがここに表示される -->
            </div>

        </div>

        <!-- テンプレート未選択時のメッセージ -->
        <div id="template-empty" data-testid="template-empty" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px;">
          テンプレートを選択してください
        </div>

      </div>

    </div>

    <!-- タブ2: ルール定義 -->
    <div id="tab-rules" class="tab-content" style="flex: 1; display: none; flex-direction: column; overflow: hidden;">
      
      <div style="flex: 1; display: flex; gap: 0; overflow: hidden;">
        
        <!-- 左側: ルール一覧 -->
        <div style="width: 35%; background: var(--bg-main); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow: hidden;">
          <div style="padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <input type="text" id="rule-search" data-testid="rule-search" placeholder="ルール検索..." style="width: 100%; padding: 6px 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 13px; box-sizing: border-box;" />
          </div>
          <div style="flex: 1; overflow-y: auto;">
            <div id="rule-list" data-testid="rule-list" style="display: flex; flex-direction: column; gap: 0;">
              <!-- ルール項目がここに動的に追加される -->
            </div>
          </div>
          <div style="padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.1);">
            <button class="action-btn" id="btn-new-rule" data-testid="new-rule-button" style="width: 100%; font-size: 13px; padding: 8px 12px;">+ 新規ルール作成</button>
          </div>
        </div>

        <!-- 右側: ルール詳細編集 -->
        <div style="flex: 1; background: var(--bg-card); display: flex; flex-direction: column; overflow: hidden;">
          <div id="rule-detail" data-testid="rule-detail" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; gap: 0;">
            
            <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
              
              <div>
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500;">ルール名 *</label>
                <input type="text" id="rule-name" data-testid="rule-name" placeholder="例：営業向け標準ルール" style="width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 13px; box-sizing: border-box;" />
              </div>

              <div>
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500;">ルール説明</label>
                <textarea id="rule-description" data-testid="rule-description" placeholder="このルールの適用条件や目的を記入..." style="width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 13px; box-sizing: border-box; min-height: 60px; resize: vertical;"></textarea>
              </div>

              <div>
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500;">適用対象テンプレート *</label>
                <select id="rule-template" data-testid="rule-template" style="width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 13px; box-sizing: border-box;">
                  <option value="">選択してください</option>
                  <option value="全テンプレート">全テンプレート</option>
                  <option value="売買契約">売買契約</option>
                  <option value="サービス契約">サービス契約</option>
                  <option value="NDA">NDA（秘密保持契約）</option>
                </select>
              </div>

              <div>
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500;">適用対象ユーザー役割</label>
                <select id="rule-role" data-testid="rule-role" style="width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 13px; box-sizing: border-box;">
                  <option value="">選択してください</option>
                  <option value="管理者">管理者</option>
                  <option value="営業">営業</option>
                  <option value="品質管理者">品質管理者</option>
                  <option value="請求担当者">請求担当者</option>
                </select>
              </div>

              <div>
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500;">ルール内容（JSON形式）</label>
                <textarea id="rule-content" data-testid="rule-content" placeholder='{"required_fields": ["契約金額", "契約期間"], "approval_required": true}' style="width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 12px; box-sizing: border-box; min-height: 100px; resize: vertical; font-family: 'Courier New', monospace;"></textarea>
              </div>

              <div style="display: flex; gap: 8px;">
                <button class="action-btn" id="btn-save-rule" data-testid="save-rule-button" style="flex: 1; font-size: 13px; padding: 10px;">保存</button>
                <button class="action-btn secondary" id="btn-delete-rule" data-testid="delete-rule-button" style="flex: 1; font-size: 13px; padding: 10px;">削除</button>
              </div>

            </div>

          </div>

          <!-- ルール未選択時のメッセージ -->
          <div id="rule-empty" data-testid="rule-empty" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px;">
            ルールを選択してください
          </div>

        </div>

      </div>

    </div>

    <!-- タブ3: 変更履歴 -->
    <div id="tab-history" class="tab-content" style="flex: 1; display: none; flex-direction: column; overflow: hidden; padding: 16px;">
      
      <div style="margin-bottom: 12px; display: flex; gap: 8px;">
        <input type="text" id="history-search" data-testid="history-search" placeholder="履歴検索..." style="flex: 1; padding: 6px 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 4px; font-size: 13px;" />
        <button class="action-btn" id="btn-search-history" data-testid="search-history-button" style="font-size: 12px; padding: 6px 10px;">検索</button>
      </div>

      <div style="flex: 1; overflow-y: auto;">
        <div id="history-list" data-testid="history-list" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- 変更履歴がここに動的に追加される -->
        </div>
      </div>

    </div>

  </div>

</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });
})();

</script>
